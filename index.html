<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VibeMatch · Free Time? Find Your People</title>
    <meta name="description" content="Campus-first social activity platform. Free time? Find your people for badminton, cricket, basketball, coffee, study groups, and spontaneous hangouts." />
    <meta property="og:title" content="VibeMatch · Free Time? Find Your People" />
    <meta property="og:description" content="Campus-first social activity platform for college students. Discover and join spontaneous activities with compatible classmates." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vibematch_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldBeDark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          if (shouldBeDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#DDE3E8] text-[#3A0F34] dark:bg-[#0A0E17] dark:text-slate-100 antialiased selection:bg-[#EAAA00]/30 selection:text-[#3A0F34] dark:selection:text-[#EAAA00]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
