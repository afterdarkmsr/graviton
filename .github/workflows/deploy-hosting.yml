
name: Deploy Firebase Hosting (V1 Production)

on:
  workflow_dispatch:

concurrency:
  group: deploy-hosting-vibematchcgc-production
  cancel-in-progress: false

permissions: {}

jobs:
  verify-hosting-config:
    name: Verify Branch, Config & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Enforce main branch only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Hosting deployment is allowed only from main."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Firebase configuration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const project = 'vibematchcgc';
          const database = 'ai-studio-vibematch-09820417-4ebc-451c-a187-a205e2662ff9';

          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
          const cfg = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const app = JSON.parse(fs.readFileSync('firebase-applet-config.json', 'utf8'));

          if (rc.projects?.default !== project) {
            throw new Error('Incorrect Firebase project');
          }

          if (cfg.hosting?.public !== 'dist') {
            throw new Error('Incorrect Hosting output directory');
          }

          if (
            !Array.isArray(cfg.firestore) ||
            cfg.firestore.length !== 1 ||
            cfg.firestore[0].database !== database
          ) {
            throw new Error('Incorrect Firestore database configuration');
          }

          const required = [
            'projectId',
            'appId',
            'apiKey',
            'authDomain',
            'firestoreDatabaseId',
            'storageBucket',
            'messagingSenderId'
          ];

          for (const key of required) {
            if (typeof app[key] !== 'string' || !app[key].trim()) {
              throw new Error(`Missing Firebase config: ${key}`);
            }
          }

          if (
            app.projectId !== project ||
            app.firestoreDatabaseId !== database
          ) {
            throw new Error('Firebase app target mismatch');
          }

          console.log('Firebase configuration verified.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            echo "::error::No supported lockfile found."
            exit 1
          fi

      - name: Check TypeScript
        run: npx tsc --noEmit

  deploy-hosting-production:
    name: Build & Deploy Hosting to vibematchcgc
    needs: verify-hosting-config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Enforce main branch only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Hosting deployment is allowed only from main."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          VAR_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VAR_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          VITE_ENABLE_FEEDBACK_FUNCTIONS: ${{ vars.VITE_ENABLE_FEEDBACK_FUNCTIONS }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const project = 'vibematchcgc';
          const database = 'ai-studio-vibematch-09820417-4ebc-451c-a187-a205e2662ff9';

          if (!process.env.WIF_PROVIDER || !process.env.DEPLOY_SA) {
            throw new Error('Missing GitHub Workload Identity variables');
          }

          if (
            process.env.VAR_PROJECT_ID &&
            process.env.VAR_PROJECT_ID !== project
          ) {
            throw new Error('Incorrect project environment variable');
          }

          if (
            process.env.VAR_DATABASE_ID &&
            process.env.VAR_DATABASE_ID !== database
          ) {
            throw new Error('Incorrect database environment variable');
          }

          const flag = (process.env.VITE_ENABLE_FEEDBACK_FUNCTIONS || '').trim();

          if (flag !== '' && flag !== 'false') {
            throw new Error('Feedback Cloud Functions must remain disabled');
          }

          const app = JSON.parse(fs.readFileSync('firebase-applet-config.json', 'utf8'));

          const required = [
            'projectId',
            'appId',
            'apiKey',
            'authDomain',
            'firestoreDatabaseId',
            'storageBucket',
            'messagingSenderId'
          ];

          for (const key of required) {
            if (typeof app[key] !== 'string' || !app[key].trim()) {
              throw new Error(`Missing Firebase config: ${key}`);
            }
          }

          if (
            app.projectId !== project ||
            app.firestoreDatabaseId !== database
          ) {
            throw new Error('Firebase app target mismatch');
          }

          console.log('Production configuration verified.');
          NODE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            echo "::error::No supported lockfile found."
            exit 1
          fi

      - name: Build Vite frontend
        env:
          VITE_ENABLE_FEEDBACK_FUNCTIONS: ${{ vars.VITE_ENABLE_FEEDBACK_FUNCTIONS }}
        run: |
          npm run build
          test -f dist/index.html

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firebase Hosting only
        run: |
          firebase deploy --only hosting --project vibematchcgc --non-interactive
