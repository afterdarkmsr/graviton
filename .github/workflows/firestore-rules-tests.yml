name: Firestore Security Rules & Hardening Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  firestore-rules-and-security-tests:
    name: Firestore Rules Emulator & TypeScript Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install root dependencies (from bun.lock)
        run: bun install --frozen-lockfile

      - name: Install Cloud Functions dependencies (from functions/package-lock.json)
        run: npm --prefix functions ci

      - name: Ensure Firebase CLI is installed
        run: |
          if ! command -v firebase >/dev/null 2>&1; then
            npm install -g firebase-tools
          fi
          firebase --version
          java -version

      - name: Verify named Firestore database configuration
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
            const entries = Array.isArray(cfg.firestore) ? cfg.firestore : [cfg.firestore];
            const expectedDb = "ai-studio-vibematch-09820417-4ebc-451c-a187-a205e2662ff9";
            if (entries.length !== 1 || entries[0]?.database !== expectedDb) {
              console.error("Expected single named Firestore database config:", expectedDb, "found:", entries);
              process.exit(1);
            }
            if (entries[0]?.rules !== "firestore.rules" || entries[0]?.indexes !== "firestore.indexes.json") {
              console.error("Unexpected rules/indexes mapping in firebase.json:", entries[0]);
              process.exit(1);
            }
            if (!cfg.emulators?.firestore?.host || !cfg.emulators?.firestore?.port) {
              console.error("Missing emulators.firestore host/port in firebase.json");
              process.exit(1);
            }
            console.log("Preserved named Firestore database config:", entries[0].database);
          '

      - name: Frontend TypeScript check
        run: npx tsc --noEmit

      - name: Cloud Functions TypeScript check
        run: npm --prefix functions exec -- tsc --noEmit

      - name: Emulator rules test script TypeScript check
        run: npx tsc --ignoreConfig --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --esModuleInterop --types node scripts/testFirestoreRulesEmulator.ts

      - name: Run 24 security-hardening verification tests
        run: npx tsx scripts/verifySecurityHardening.ts

      - name: Run Firestore Emulator security rules suite (local demo project only)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          firebase emulators:exec --only firestore --project demo-vibematch-test "npx tsx scripts/testFirestoreRulesEmulator.ts"
